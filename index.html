<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flagship Tier Rankings</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
        }
        .markdown-body {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: #24292f; margin-bottom: 30px; }
    </style>
</head>
<body>
    <h1>🚀 Flagship Model Value Index</h1>
    <div id="content" class="markdown-body">Loading...</div>

    <script>
        async function loadMarkdown() {
            try {
                const response = await fetch('content/rankings.md');
                const text = await response.text();
                document.getElementById('content').innerHTML = marked.parse(text);
            } catch (e) {
                document.getElementById('content').innerHTML = 'Error loading content: ' + e;
            }
        }
        loadMarkdown();
    </script>
</body>
</html>
