<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Access Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    <style>
        :root {
            --sidebar-width: 280px;
            --bg-color: #f6f8fa;
            --sidebar-bg: #ffffff;
            --text-main: #24292f;
            --accent-color: #0969da;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid #d0d7de;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-sizing: border-box;
        }
        #sidebar h2 {
            padding: 0 20px;
            font-size: 16px;
            color: #57606a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }
        .nav-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-main);
            text-decoration: none;
            transition: background 0.2s;
            font-size: 14px;
            border-left: 4px solid transparent;
        }
        .nav-item:hover {
            background-color: #f3f4f6;
        }
        .nav-item.active {
            background-color: #f3f4f6;
            color: var(--accent-color);
            border-left-color: var(--accent-color);
            font-weight: 600;
        }
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
        }
        .markdown-body {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            color: #24292f !important;
            max-width: 900px;
            margin: 0 auto;
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Analysis</h2>
        <div id="nav-links">
            <a class="nav-item active" data-file="rankings.md">💰 $20 Budget Analysis</a>
            <a class="nav-item" data-file="free-rankings.md">🆓 Free Tier Analysis</a>
        </div>
    </div>

    <div id="main-content">
        <div id="content" class="markdown-body">Loading content...</div>
    </div>

    <div id="loading-overlay">Loading...</div>

    <script>
        const contentDiv = document.getElementById('content');
        const navItems = document.querySelectorAll('.nav-item');
        const loader = document.getElementById('loading-overlay');

        async function loadPage(fileName) {
            loader.style.display = 'flex';
            try {
                // Note: the files are stored in the /docs/content/ folder on GH Pages
                const response = await fetch(`docs/content/${fileName}`);
                if (!response.ok) throw new Error(`Failed to load ${fileName}`);
                const text = await response.text();
                contentDiv.innerHTML = marked.parse(text);
                
                // Update URL hash for deep linking
                window.location.hash = fileName;
            } catch (e) {
                contentDiv.innerHTML = `<div style="color: red; text-align: center;">Error loading content: ${e.message}</div>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                loadPage(item.dataset.file);
            });
        });

        // Initial load based on URL hash or default
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            if (hash && document.querySelector(`.nav-item[data-file="${hash}"]`)) {
                const target = document.querySelector(`.nav-item[data-file="${hash}"]`);
                navItems.forEach(i => i.classList.remove('active'));
                target.classList.add('active');
                loadPage(hash);
            } else {
                loadPage('rankings.md');
            }
        });
    </script>
</body>
</html>
