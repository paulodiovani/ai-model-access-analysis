<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Access Analysis</title>
    
    <!-- OpenGraph / Social Media Meta Tags -->
    <meta property="og:title" content="AI Model Access Analysis: The Agentic Value Index">
    <meta property="og:description" content="Comparative analysis of flagship AI model access providers, focusing on the best price-per-token and rate-limit resilience for agentic workflows.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://paulodiovani.github.io/ai-model-access-analysis/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Model Access Analysis: The Agentic Value Index">
    <meta name="twitter:description" content="Finding the best deals on flagship AI reasoning for agents and developers.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    
    <style>
        body, .markdown-body, aside, main {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .markdown-body {
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .light .markdown-body { background-color: #ffffff; }
        .dark .markdown-body { background-color: #0d1117; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 flex flex-col h-full shadow-xl z-20 bg-slate-900 text-slate-300 dark:bg-slate-950 dark:text-slate-400">
        <div class="p-6">
            <h1 class="text-white text-xl font-bold flex items-center gap-2">
                <span>🚀</span> Access Analysis
            </h1>
            <p class="text-xs text-slate-400 mt-1">Agentic Value Index</p>
        </div>

        <nav class="flex-1 px-3 space-y-1">
            <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Analysis Documents</p>
            
            <a href="#" 
               data-file="rankings.md" 
               class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-800 hover:text-white group"
               id="link-rankings">
                <span class="text-lg">💰</span>
                <span class="text-sm font-medium">$20 Budget Analysis</span>
            </a>
            
            <a href="#" 
               data-file="free-rankings.md" 
               class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-800 hover:text-white group"
               id="link-free">
                <span class="text-lg">🆓</span>
                <span class="text-sm font-medium">Free Tier Analysis</span>
            </a>
        </nav>

        <nav class="flex-1 px-3 space-y-1">
            <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">General</p>
            <a href="#" 
               data-file="about.md" 
               class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-800 hover:text-white group"
               id="link-about">
                <span class="text-lg">ℹ️</span>
                <span class="text-sm font-medium">About the Project</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-center">
            <a href="https://github.com/paulodiovani/ai-model-access-analysis" target="_blank" class="text-xs text-slate-500 hover:text-slate-300 flex items-center justify-center gap-1">
                View on GitHub ↗
            </a>
        </div>
    </aside>

    <main id="main-bg" class="flex-1 overflow-y-auto relative bg-slate-100 dark:bg-slate-900">
        <div class="max-w-4xl mx-auto py-12 px-6">
            <div id="content" class="markdown-body min-h-[60vh] transition-opacity duration-300 opacity-100">
                Loading content...
            </div>
        </div>
    </main>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-slate-800 p-4 rounded-full shadow-lg animate-spin h-10 w-10 border-4 border-slate-200 dark:border-slate-700 border-t-slate-900 dark:border-t-white"></div>
    </div>

    <script>
        const contentDiv = document.getElementById('content');
        const loader = document.getElementById('loader');
        const navLinks = document.querySelectorAll('.nav-link');

        function applyTheme() {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        applyTheme();

        async function loadPage(fileName) {
            contentDiv.style.opacity = '0';
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`content/${fileName}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                contentDiv.innerHTML = marked.parse(text);
            } catch (e) {
                contentDiv.innerHTML = `<div class="text-center py-20"><div class="text-5xl mb-4">❌</div><h3 class="text-xl font-bold">Error loading content</h3><p>${e.message}</p></div>`;
            } finally {
                contentDiv.style.opacity = '1';
                loader.classList.add('hidden');
            }
        }

        function updateActiveState(activeFile) {
            navLinks.forEach(link => {
                if (link.dataset.file === activeFile) {
                    link.classList.add('bg-slate-800', 'text-white', 'font-semibold');
                    link.classList.remove('text-slate-300');
                } else {
                    link.classList.remove('bg-slate-800', 'text-white', 'font-semibold');
                    link.classList.add('text-slate-300');
                }
            });
        }

        navLinks.forEach(link => {
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                const file = link.dataset.file;
                updateActiveState(file);
                window.location.hash = file;
                await loadPage(file);
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            const initialFile = (hash && document.querySelector(`.nav-link[data-file="${hash}"]`)) ? hash : 'rankings.md';
            updateActiveState(initialFile);
            loadPage(initialFile);
        });
    </script>
</body>
</html>
