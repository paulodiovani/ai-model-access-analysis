<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Access Analysis</title>
    
    <!-- Tailwind CSS for modern layout and utility styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- GitHub Markdown CSS for clean document rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
        }
        .markdown-body {
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            /* FORCE DARK TEXT FOR LIGHT MODE */
            color: #24292f !important;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: #1a1c1e !important;
        }
        .markdown-body p, .markdown-body li, .markdown-body td, .markdown-body th {
            color: #24292f !important;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-900 h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col h-full shadow-xl z-20">
        <div class="p-6">
            <h1 class="text-white text-xl font-bold flex items-center gap-2">
                <span>🚀</span> Access Analysis
            </h1>
            <p class="text-xs text-slate-400 mt-1">Agentic Value Index</p>
        </div>

        <nav class="flex-1 px-3 space-y-1">
            <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Analysis Documents</p>
            
            <a href="#" 
               data-file="rankings.md" 
               class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-800 hover:text-white group active"
               id="link-rankings">
                <span class="text-lg">💰</span>
                <span class="text-sm font-medium">$20 Budget Analysis</span>
            </a>
            
            <a href="#" 
               data-file="free-rankings.md" 
               class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-200 hover:bg-slate-800 hover:text-white group"
               id="link-free">
                <span class="text-lg">🆓</span>
                <span class="text-sm font-medium">Free Tier Analysis</span>
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-center">
            <a href="https://github.com/paulodiovani/ai-model-access-analysis" target="_blank" class="text-xs text-slate-500 hover:text-slate-300 flex items-center justify-center gap-1">
                View on GitHub ↗
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto relative bg-slate-100">
        <div class="max-w-4xl mx-auto py-12 px-6">
            <div id="content" class="markdown-body min-h-[60vh] transition-opacity duration-300 opacity-100">
                Loading content...
            </div>
        </div>
    </main>

    <!-- LOADING OVERLAY -->
    <div id="loader" class="hidden fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white p-4 rounded-full shadow-lg animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-slate-900"></div>
    </div>

    <script>
        const contentDiv = document.getElementById('content');
        const loader = document.getElementById('loader');
        const navLinks = document.querySelectorAll('.nav-link');

        async function loadPage(fileName) {
            contentDiv.style.opacity = '0';
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`content/${fileName}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                
                const text = await response.text();
                contentDiv.innerHTML = marked.parse(text);
            } catch (e) {
                contentDiv.innerHTML = `
                    <div class="text-center py-20">
                        <div class="text-5xl mb-4">❌</div>
                        <h3 class="text-xl font-bold text-slate-800">Failed to load content</h3>
                        <p class="text-slate-500">${e.message}</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded-md text-sm">Retry</button>
                    </div>
                `;
            } finally {
                contentDiv.style.opacity = '1';
                loader.classList.add('hidden');
            }
        }

        function updateActiveState(activeFile) {
            navLinks.forEach(link => {
                if (link.dataset.file === activeFile) {
                    link.classList.add('bg-slate-800', 'text-white', 'font-semibold');
                    link.classList.remove('text-slate-300');
                } else {
                    link.classList.remove('bg-slate-800', 'text-white', 'font-semibold');
                    link.classList.add('text-slate-300');
                }
            });
        }

        navLinks.forEach(link => {
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                const file = link.dataset.file;
                updateActiveState(file);
                window.location.hash = file;
                await loadPage(file);
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            const initialFile = (hash && document.querySelector(`.nav-link[data-file="${hash}"]增加了`)) ? hash : 'rankings.md';
            
            updateActiveState(initialFile);
            loadPage(initialFile);
        });
    </script>
</body>
</html>
