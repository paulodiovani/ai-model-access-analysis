name: Bug Report or Feature Request
description: Report a bug or suggest a new provider/feature
title: "[BUG/FEATURE]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue or suggest an improvement!

  - type: input
    id: provider
    attributes:
      label: Provider or Page
      description: Which provider or page is this about?
      placeholder: e.g. OpenCode Go, Free Tier Analysis, Google AI Studio
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of issue is this?
      options:
        - Incorrect pricing/limit
        - Bug in the website
        - Feature request
        - New provider suggestion
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the issue or feature request.
      placeholder: Describe what is wrong or what you'd like to see.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Source
      description: Link to official documentation or pricing page that shows the correct information.
      placeholder: e.g. https://openai.com/pricing
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about your agentic workflow that makes this change necessary.
    validations:
      required: false
